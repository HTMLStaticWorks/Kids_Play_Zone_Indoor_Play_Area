<body class="bg-background dark:bg-on-background text-on-background dark:text-background font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- TopNavBar Suppressed as per Shared Components Logic (Transactional Page: Login) -->
<div class="absolute top-6 right-6 flex items-center gap-4 z-50">
<button onclick="document.documentElement.dir = document.documentElement.dir === 'rtl' ? 'ltr' : 'rtl';" aria-label="Toggle RTL" class="text-on-surface-variant dark:text-inverse-on-surface hover:text-primary transition-colors font-label-md text-label-md uppercase">RTL</button>
<button onclick="document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';" class="text-on-surface-variant dark:text-inverse-on-surface hover:bg-primary/5 rounded-full p-2"><span class="material-symbols-outlined">dark_mode</span></button>
</div>
<main class="flex-grow flex flex-col items-center justify-center relative playful-bg py-20 px-margin-mobile md:px-margin-desktop">
<!-- Login Section -->
<div class="w-full max-w-md bg-surface-container-lowest dark:bg-[#122242] rounded-[24px] shadow-level-1 p-8 md:p-10 relative z-10">
<div class="text-center mb-8">
<a href="index.html" class="inline-flex items-center gap-2.5 mb-3 hover:opacity-80 transition-opacity">
    <img src="logo.png" alt="Logo" class="h-10 w-10 object-cover rounded-full shadow-sm">
    <span class="font-headline-xl text-3xl font-extrabold text-primary dark:text-primary-fixed tracking-tight">PlayZone</span>
</a>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-[#cbd5e1]">Welcome back! Let's get playing.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface dark:text-[#f8fafc] mb-2" for="email">Email Address</label>
<input class="w-full rounded-[16px] border border-outline-variant dark:border-[#3f4850] px-4 py-3 font-body-md text-body-md text-on-surface dark:text-[#f8fafc] focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" placeholder="parent@example.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface dark:text-[#f8fafc] mb-2" for="password">Password</label>
<input class="w-full rounded-[16px] border border-outline-variant dark:border-[#3f4850] px-4 py-3 font-body-md text-body-md text-on-surface dark:text-[#f8fafc] focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<div class="text-right mt-2">
<a class="font-label-md text-sm text-primary dark:text-primary-fixed hover:text-primary-container hover:underline transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md hover:shadow-level-2 hover:scale-[0.98] transition-all active:scale-95 flex items-center justify-center gap-2" type="button">
                    Login securely
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
</button>
<div class="text-center mt-6">
<p class="font-body-md text-body-md text-on-surface-variant dark:text-[#cbd5e1]">
                        New to PlayZone? 
                        <a class="text-tertiary-container font-label-md text-label-md hover:underline" href="signup.html">Sign up here</a>
</p>
</div>
</form>
</div>

<!-- Scroll to Top Button -->
<button id="scrollToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 bg-primary text-on-primary p-3 rounded-full shadow-lg hover:scale-110 transition-all duration-300 z-50 opacity-0 pointer-events-none translate-y-4 flex items-center justify-center">
    <span class="material-symbols-outlined">arrow_upward</span>
</button>
<script>
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            scrollToTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            scrollToTopBtn.classList.add('opacity-100', 'translate-y-0');
        } else {
            scrollToTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            scrollToTopBtn.classList.remove('opacity-100', 'translate-y-0');
        }
    });
</script>
