<!DOCTYPE html>

<html lang="en"><head>
<script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
    } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
    }
</script>
<meta charset="utf-8"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PlayZone - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Nunito+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "error-container": "#ffdad6",
                        "surface-dim": "#ccd9ff",
                        "inverse-primary": "#92ccff",
                        "on-surface": "#0a1a3a",
                        "on-primary-fixed": "#001e31",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f1f3ff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#007bb9",
                        "on-secondary-fixed": "#221b00",
                        "on-primary": "#ffffff",
                        "secondary": "#705d00",
                        "surface-bright": "#faf8ff",
                        "outline": "#6f7881",
                        "surface-variant": "#d9e2ff",
                        "on-tertiary-fixed-variant": "#8f0046",
                        "on-secondary-fixed-variant": "#544600",
                        "surface-container-high": "#e1e8ff",
                        "surface": "#faf8ff",
                        "tertiary": "#b5075a",
                        "tertiary-container": "#d72e73",
                        "inverse-surface": "#213050",
                        "secondary-fixed-dim": "#e9c400",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#ffb1c5",
                        "inverse-on-surface": "#edf0ff",
                        "error": "#ba1a1a",
                        "secondary-container": "#fdd400",
                        "tertiary-fixed": "#ffd9e1",
                        "on-tertiary-fixed": "#3f001b",
                        "outline-variant": "#bfc7d2",
                        "surface-container-highest": "#d9e2ff",
                        "on-surface-variant": "#3f4850",
                        "background": "#faf8ff",
                        "primary": "#006193",
                        "secondary-fixed": "#ffe170",
                        "primary-fixed": "#cce5ff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#92ccff"
                    },

<style>
        .shadow-ambient-l1 { box-shadow: 0 4px 20px rgba(0, 97, 147, 0.05); }
        .shadow-ambient-l2 { box-shadow: 0 8px 30px rgba(0, 97, 147, 0.1); }
    </style>

<body class="bg-background dark:bg-on-background text-on-background dark:text-background antialiased font-body-md min-h-screen flex flex-col justify-center relative">
<div class="absolute top-6 right-6 flex items-center gap-4 z-50">
<button onclick="document.documentElement.dir = document.documentElement.dir === 'rtl' ? 'ltr' : 'rtl';" aria-label="Toggle RTL" class="text-on-surface-variant dark:text-inverse-on-surface hover:text-primary transition-colors font-label-md text-label-md uppercase">RTL</button>
<button onclick="document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';" class="text-on-surface-variant dark:text-inverse-on-surface hover:bg-primary/5 rounded-full p-2" title="Toggle Dark Mode"><span class="material-symbols-outlined">dark_mode</span></button>
</div>
<main class="flex-grow flex items-center justify-center py-16 px-margin-mobile md:px-margin-desktop">
<div class="w-full max-w-lg mx-auto">
<!-- Registration Form Card with Brand Name Inside -->
<div class="bg-surface-container-lowest dark:bg-[#122242] p-8 md:p-10 rounded-[24px] shadow-lg border border-outline-variant/20 dark:border-[#3f4850]/40">
<div class="text-center mb-8">
<a href="index.html" class="inline-flex items-center gap-2.5 mb-3 hover:opacity-80 transition-opacity">
    <img src="logo.png" alt="Logo" class="h-9 w-9 object-cover rounded-full shadow-sm">
    <span class="font-headline-xl text-3xl font-extrabold text-primary dark:text-primary-fixed tracking-tight">PlayZone</span>
</a>
<h1 class="font-headline-xl text-2xl md:text-3xl text-on-surface dark:text-[#f8fafc] font-extrabold mb-2">Join the Fun!</h1>
<p class="font-body-md text-sm text-on-surface-variant dark:text-[#cbd5e1] max-w-sm mx-auto">Create an account to start booking play sessions and accessing exclusive offers.</p>
</div>
<form class="space-y-6">
<!-- Parent Details -->
<div class="space-y-4">
<h3 class="font-headline-md text-lg font-bold text-on-surface dark:text-[#f8fafc]">Parent Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">First Name</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] text-on-surface dark:text-[#f8fafc] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Jane" type="text"/>
</div>
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">Last Name</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] text-on-surface dark:text-[#f8fafc] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Doe" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">Email Address</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] text-on-surface dark:text-[#f8fafc] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">Password</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] text-on-surface dark:text-[#f8fafc] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Child Details -->
<div class="space-y-4 pt-4 border-t border-outline-variant/30 dark:border-[#3f4850]/50">
<h3 class="font-headline-md text-lg font-bold text-on-surface dark:text-[#f8fafc]">Child Details (Optional)</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">Child's Name</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] text-on-surface dark:text-[#f8fafc] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Tommy" type="text"/>
</div>
<div>
<label class="block font-label-md text-sm text-on-surface-variant dark:text-[#cbd5e1] mb-2 font-semibold">Date of Birth</label>
<input class="w-full bg-surface-container-low dark:bg-[#1a2a4a] border border-outline-variant dark:border-[#3f4850] rounded-[16px] px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-on-surface dark:text-[#f8fafc]" type="date"/>
</div>
</div>
<button class="text-primary font-label-md text-sm flex items-center gap-2 hover:opacity-80 font-semibold" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span> Add another child
</button>
</div>
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-label-md text-base font-bold py-4 rounded-full transition-transform active:scale-95 shadow-md hover:opacity-95" type="submit">
                                Create Account
</button>
</div>
<div class="text-center mt-6">
<p class="font-body-md text-sm text-on-surface-variant dark:text-[#cbd5e1]">
    Already have an account? 
    <a class="text-primary dark:text-primary-fixed font-bold hover:underline" href="login.html">Log in here</a>
</p>
</div>
</form>
</div>
</div>
</main>


<!-- Scroll to Top Button -->
<button id="scrollToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 bg-primary text-on-primary p-3 rounded-full shadow-lg hover:scale-110 transition-all duration-300 z-50 opacity-0 pointer-events-none translate-y-4 flex items-center justify-center">
    <span class="material-symbols-outlined">arrow_upward</span>
</button>
<script>
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            scrollToTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            scrollToTopBtn.classList.add('opacity-100', 'translate-y-0');
        } else {
            scrollToTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            scrollToTopBtn.classList.remove('opacity-100', 'translate-y-0');
        }
    });
</script>
</body></html>
